# Every push and pull request: build, lint, every test suite, and a real container deploy.
# Merge to main only when all jobs are green (docs/RUNBOOK.md → Releases on GitHub).
name: Checks
on: [push, pull_request]
permissions: {contents: read}
concurrency: {group: "checks-${{ github.ref }}", cancel-in-progress: true}

jobs:
  server:
    name: Build, lint and server tests (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy: {matrix: {node: ["22", "24"]}}
    services:
      redis: {image: "redis:7.4.12-alpine", ports: ["6379:6379"]}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: "${{ matrix.node }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install ruff==0.16.8
      - run: cd webapp && npm ci
      - run: sh tools/check.sh
        env: {TEST_REDIS_URL: "redis://127.0.0.1:6379/15"}
      - name: The committed release folder matches the source
        run: |
          git diff --exit-code -- release/ || { echo "release/ is out of date; run python3 tools/build.py and commit it"; exit 1; }

  python:
    name: Python tests with real SFINCS runs, 90% coverage each (modelling, satellite, world)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: {SFINCS_BIN: "${{ github.workspace }}/modelling/.sfincs/bin/sfincs"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: sudo apt-get update && sudo apt-get install -y gfortran autoconf automake libtool make libnetcdff-dev
      - name: SFINCS, built once per pinned revision
        uses: actions/cache@v6
        with: {path: modelling/.sfincs, key: "sfincs-ubuntu-24.04-${{ hashFiles('modelling/build_sfincs.sh') }}"}
      - run: sh modelling/build_sfincs.sh
      - run: pip install -c tools/python-constraints.txt -r modelling/requirements.txt -r satellite/requirements.txt pytest pytest-cov
      - name: Every package's tests, failing below 90% coverage of its code
        run: |
          for pkg in modelling satellite world; do
            (cd "$pkg" && python -m pytest tests -q --cov=. --cov-config=../tools/coveragerc --cov-fail-under=90) || exit 1
          done

  browser:
    name: Browser tests (claude.ai page and web app)
    runs-on: ubuntu-24.04   # the newest image that Playwright 1.56 installs Chromium's system packages on
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: "24"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install playwright==1.56.0 numpy==2.3.4 pillow==12.0.0
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix tools/lint   # the bundler, and axe-core for the accessibility checks
      - run: python3 tools/build.py
      - run: cd dist/opentracker-webapp && npm ci
      - name: The browser code loads as plain ES modules (no load-order faults hidden by bundling)
        run: python3 tests/web/modules_test.py
      - name: Eleven scenarios on the claude.ai page (incl. script injection and accessibility)
        run: python3 tests/e2e/run.py
      - name: The web app, its console and the 3D projection
        run: python3 tests/web/webapp_test.py
      - uses: actions/upload-artifact@v6
        if: failure()
        with: {name: browser-test-screens, path: "tests/*/out/"}

  load:
    name: Load test (reads, alert sign-ups, notification fan-out) and the capacity plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis: {image: "redis:7.4.12-alpine", ports: ["6379:6379"]}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: "24"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: npm ci --prefix tools/lint
      - run: python3 tools/build.py
      - run: cd webapp && npm ci
      - name: Load test, failing below the thresholds in load/loadtest.js
        working-directory: webapp
        env: {REDIS_URL: "redis://127.0.0.1:6379/14"}
        run: node load/loadtest.js --seconds 10 --check --out load-test.json
      - name: What 5 billion people would need, from these measurements
        if: always()
        working-directory: webapp
        run: |
          [ -f load-test.json ] || exit 0
          { echo "### Capacity plan for 5 billion people (measured on this runner)"; node load/capacity.js load-test.json; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: load-test, path: webapp/load-test.json, if-no-files-found: ignore}

  ops:
    name: Backups, restore and deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y redis-server shellcheck
      - run: shellcheck -s sh webapp/ops/*.sh tests/ops/*.sh tools/check.sh modelling/build_sfincs.sh
      - run: sh tests/ops/backup_restore_test.sh
      - run: sh tests/ops/deploy_test.sh

  container:
    name: Real deploy with Docker Compose (staging settings, local domain)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [server]
    defaults: {run: {working-directory: release/opentracker-webapp}}
    steps:
      - uses: actions/checkout@v6
      - name: Settings for a local staging deploy
        run: |
          sed -e 's/^SITE_DOMAIN=.*/SITE_DOMAIN=localhost/' -e 's/^VAPID_SUBJECT=.*/VAPID_SUBJECT=mailto:ci@example.org/' \
              -e 's/^ALERT_NAME=.*/ALERT_NAME=Open Tracker CI/' -e 's/^FEEDS_OFF=.*/FEEDS_OFF=all/' env.example > .env.staging
          docker compose -p opentracker-staging --env-file .env.staging config --quiet
      - name: Deploy (build, start, smoke test)
        run: SMOKE_INSECURE=1 sh ops/deploy.sh staging
      - name: A backup from the running service
        run: |
          docker compose -p opentracker-staging --env-file .env.staging exec -T backup sh /ops/backup-redis.sh
          ls -l backups/ && test -n "$(ls backups/opentracker-*.rdb.gz)"
      - name: Status
        run: SMOKE_INSECURE=1 sh ops/deploy.sh staging status
      - name: Logs on failure
        if: failure()
        run: docker compose -p opentracker-staging --env-file .env.staging logs --tail 200
